name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install (not npm ci) so the Linux CI runner can pull platform-
        # specific optional deps (e.g. @emnapi/runtime via sharp) that the
        # Windows-generated lock omits. Same fix as 87cefca for Docker.
        run: npm install --no-audit --no-fund --no-progress

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage/coverage-summary.json';
            if (!fs.existsSync(path)) {
              core.warning('coverage-summary.json missing — skipping PR comment');
              return;
            }
            const summary = JSON.parse(fs.readFileSync(path, 'utf8')).total;
            const fmt = (m) => `${m.pct.toFixed(2)}% (${m.covered}/${m.total})`;
            const body = [
              '### Coverage',
              '',
              '| Metric | Value |',
              '| --- | --- |',
              `| Lines | ${fmt(summary.lines)} |`,
              `| Branches | ${fmt(summary.branches)} |`,
              `| Functions | ${fmt(summary.functions)} |`,
              `| Statements | ${fmt(summary.statements)} |`,
              '',
              '_Thresholds: lines 90, branches 85, functions 90, statements 90._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) =>
              c.user.type === 'Bot' && c.body.startsWith('### Coverage')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install (not npm ci) so the Linux CI runner can pull platform-
        # specific optional deps (e.g. @emnapi/runtime via sharp) that the
        # Windows-generated lock omits. Same fix as 87cefca for Docker.
        run: npm install --no-audit --no-fund --no-progress

      - name: Type check
        run: npx tsc --noEmit

      # Blocking subset of ESLint: Rules-of-Hooks only. The full `lint` job
      # below is advisory (legacy `any` debt), but a conditional hook crashes
      # the whole page at runtime (React #310), so this one rule must gate PRs.
      - name: React Rules-of-Hooks
        run: npm run lint:hooks

  lint:
    name: ESLint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Repo carries pre-existing lint debt (see CLAUDE.md "Known issues").
    # Run lint for visibility, but don't block PRs on it. Promote to required
    # once the legacy `any` / `react/jsx-no-undef` errors are cleaned up.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install (not npm ci) so the Linux CI runner can pull platform-
        # specific optional deps (e.g. @emnapi/runtime via sharp) that the
        # Windows-generated lock omits. Same fix as 87cefca for Docker.
        run: npm install --no-audit --no-fund --no-progress

      - name: Lint
        run: npm run lint
