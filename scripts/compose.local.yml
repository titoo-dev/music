# Local-stack override, used by scripts/stack.ps1 on top of docker-compose.yml.
# .env points S3 at http://localhost:9000 for the host-side `next dev`; inside
# the compose network the worker has to reach MinIO by its service name.
services:
  stems-worker:
    environment:
      - DEEMIX_STORAGE_TYPE=s3
      - DEEMIX_S3_ENDPOINT=http://minio:9000
    depends_on:
      minio:
        condition: service_healthy
